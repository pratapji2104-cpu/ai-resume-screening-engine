[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-screening-engine"
version = "0.1.0"
description = "Foundational AI resume screening engine using LangChain and Google Gemini"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
]
# The Gemini backend is optional: core agents work with any injectable LLM
# (e.g. the CLI's --mock mode) and only need langchain-google-genai for real
# requests.
[project.optional-dependencies]
gemini = [
    "langchain-google-genai>=1.0",
]
dev = [
    "pytest>=7",
    "ruff",
]

[project.scripts]
resume-screen = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.agents", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]